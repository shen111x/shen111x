<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EE%3C/text%3E%3C/svg%3E">
  <title>Site Header</title>
  <link rel="stylesheet" href="/css/universal.css?v=20260806">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .site-header {
      --brand-anchor-height: 2.4vw;
      --brand-expanded-height: 9.230769vw;
      --brand-first-anchor-width: 5.62vw;
      --brand-name-gap: 1.2vw;
      position: relative;
      width: 100%;
      height: calc(var(--brand-expanded-height) + (var(--page-gutter) * 2));
      padding: var(--page-gutter);
      overflow: visible;
      background: transparent;
      pointer-events: none;
    }

    .site-header__background {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(var(--brand-anchor-height) + (var(--page-gutter) * 2));
      background: #fff;
      pointer-events: none;
    }

    .site-header__background::after {
      position: absolute;
      top: calc(100% - 1px);
      left: 0;
      width: 100%;
      height: calc(var(--brand-expanded-height) - var(--brand-anchor-height) + 1px);
      background: #fff;
      content: '';
      transform: translateZ(0) scaleY(0);
      transform-origin: top;
      will-change: transform;
      transition: transform .3s ease;
    }

    .site-header__brand {
      position: relative;
      z-index: 1;
      width: 100%;
      height: var(--brand-expanded-height);
    }

    .site-header__first-name,
    .site-header__last-name {
      position: absolute;
      top: 0;
    }

    .site-header__first-name {
      left: 0;
      z-index: 1;
      height: var(--brand-expanded-height);
      aspect-ratio: 19.39 / 8.28;
      transform: translateZ(0) scale(.26);
      transform-origin: top left;
      will-change: transform;
      transition: transform .3s ease;
    }

    .site-header__last-name {
      left: calc(var(--brand-first-anchor-width) + var(--brand-name-gap));
      height: var(--brand-anchor-height);
      aspect-ratio: 6.84 / 8.33;
      opacity: 1;
      transition: opacity .3s ease;
    }

    .site-header__first-name img,
    .site-header__last-name img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .site-header__nav {
      position: absolute;
      z-index: 2;
      right: var(--page-gutter);
      bottom: var(--page-gutter);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 6vw;
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(
        0,
        calc(var(--brand-anchor-height) - var(--brand-expanded-height)),
        0
      );
      will-change: transform, opacity;
      transition: transform .3s ease, opacity .3s ease;
    }

    .site-header__nav a {
      display: block;
    }

    .site-header.is-expanded .site-header__background::after {
      transform: translateZ(0) scaleY(1);
    }

    .site-header.is-expanded .site-header__first-name {
      transform: translateZ(0) scale(1);
    }

    .site-header.is-expanded .site-header__nav {
      transform: translate3d(0, 0, 0);
    }

    .site-header.is-expanded .site-header__last-name,
    .site-header.is-expanded .site-header__nav {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .site-header {
        --brand-anchor-height: 6.63vw;
        --brand-expanded-height: 25.5vw;
        --brand-first-anchor-width: 15.525vw;
        --brand-name-gap: 3vw;
      }

      .site-header__nav { gap: 14px; }
    }
  </style>
</head>
<body>
  <header class="site-header is-expanded">
    <div class="site-header__background" aria-hidden="true"></div>
    <div class="site-header__brand">
      <div class="site-header__first-name">
        <img src="/components/header/images/first-name.svg" alt="Ean">
      </div>
      <div class="site-header__last-name">
        <img src="/components/header/images/last-name.svg" alt="Shen">
      </div>
    </div>
    <nav class="site-header__nav" aria-label="Main navigation">
      <a href="/" target="_parent">Home</a>
      <a href="/pages/work-list/" target="_parent">Works</a>
      <a href="/pages/about/" target="_parent">About</a>
    </nav>
  </header>
  <script>
    (function () {
      'use strict';

      var header = document.querySelector('.site-header');

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'scroll') return;

        if (event.data.scrollDirection === 'down') {
          header.classList.add('is-expanded');
        } else {
          header.classList.remove('is-expanded');
        }
      });
    }());
  </script>
</body>
</html>
