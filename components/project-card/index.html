<article class="project-card">
  <section class="project-card__section project-card__section--a project-card__description">
    <a class="project-card__title-link" data-field="detail-link">
      <h2 class="project-card__title" data-field="title"></h2>
    </a>
    <p class="project-card__year" data-field="year"></p>
  </section>

  <section class="project-card__section project-card__section--b project-card__categories">
    <div class="project-card__small-carousel carousel" data-carousel="small" tabindex="0" aria-label="Project cover gallery">
      <div class="carousel__track" data-field="small-gallery"></div>
    </div>
    <p class="project-card__category-list" data-field="categories"></p>
  </section>

  <section class="project-card__section project-card__section--c project-card__gallery-link">
    <div class="project-card__gallery carousel" data-carousel="large">
      <div class="carousel__track" data-field="gallery"></div>
    </div>
    <div class="project-card__gallery-indicators-wrap">
      <div class="project-card__gallery-indicators" data-field="gallery-indicators" aria-label="Gallery position"></div>
    </div>
  </section>
</article>
