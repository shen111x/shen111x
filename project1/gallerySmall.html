<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body::-webkit-scrollbar {
      width: 0%;  /* 注意，这里使用0而不是none */
    }

    body, html, div, iframe {
      margin: 0;
      padding: 0;
      border: 0;
      font-family: Helvetica, sans-serif;
    }

    .container {
      width: 100vw;
      height: 100vh;
      overflow-x: scroll;
      position: relative;
      overflow-y: hidden;
      scroll-behavior: smooth; /* Add smooth scrolling behavior */
    }

    .gallery {
      display: flex;
      transition: transform 1s ease; /* Add transition for smooth sliding */
    }

    .single {
      min-width: 100%;
      min-height: 100%;
      display: inline-block;
    }

    img {
      width: 100%;
    }

    .info {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container" onscroll="updateInfo()" onclick="nextSlide()">
    <div class="gallery" onclick="restartInterval()">
      <!-- The images will be dynamically added here -->
    </div>
  </div>

  <script>
    let imageQuantity = 0; // Initialize imageQuantity as 0

    window.addEventListener('DOMContentLoaded', () => {
      fetchImageQuantity();
    });

    function fetchImageQuantity() {
      fetch('../images/small/')
        .then(response => response.text())
        .then(text => {
          // Count the number of images in the 'small' folder
          const parser = new DOMParser();
          const htmlDoc = parser.parseFromString(text, 'text/html');
          const images = htmlDoc.querySelectorAll('a[href$=".png"], a[href$=".jpg"], a[href$=".jpeg"]');

          imageQuantity = images.length;
          // Now imageQuantity holds the number of images in the 'small' folder
          // Call a function to dynamically add images to the gallery
          addImagesToGallery();
        })
        .catch(error => {
          console.error('Error fetching image quantity:', error);
        });
    }

    function addImagesToGallery() {
      const gallery = document.querySelector('.gallery');

      for (let i = 1; i <= imageQuantity; i++) {
        const div = document.createElement('div');
        div.classList.add('single');
        const img = document.createElement('img');
        img.src = `images/small/${i}.png`; // Assuming the images are named sequentially like 1.png, 2.png, etc.
        img.alt = `Image ${i}`;
        div.appendChild(img);
        gallery.appendChild(div);
      }

      // Start the slideshow after adding images
      startSlideshow();
    }

    function startSlideshow() {
      // Call your slideshow initialization functions here
      updateInfo();
      restartInterval();
    }

    function updateInfo() {
      const container = document.querySelector('.container');
      const scrollLeft = container.scrollLeft;

      // Reset the interval when the user scrolls
      restartInterval();

      const scrollWidth = container.scrollWidth;

      scrollNeed = (scrollWidth / imageQuantity) - (scrollLeft % (scrollWidth / imageQuantity));

      if (scrollNeed < 3) {
        scrollNeed = scrollWidth / imageQuantity;
      }
    }

    function nextSlide() {
      const container = document.querySelector('.container');
      const maxScrollLeft = container.scrollWidth - container.clientWidth;

      if (container.scrollLeft + container.clientWidth >= container.scrollWidth) {
        container.scrollLeft = 0;
      } else {
        container.scrollLeft += scrollNeed;
      }

      updateInfo();
    }

    function restartInterval() {
      clearInterval(intervalId);
      intervalId = setInterval(() => {
        nextSlide();
      }, 3800);
    }

    // 第一次启动额外添加的时间
    intervalId = setInterval(() => {
      nextSlide();
    }, 800);
  </script>
</body>
</html>
