<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form Test</title>
</head>
<body>

<form
  action="https://script.google.com/macros/s/AKfycbwPEmGQkB601lUB4jiZwbT3i5r0JjgVQvw2BIf0BIWSIgncyQhQR8l_Xbqy_CMSdCLM/exec"
  method="POST"
>

  <div>
    <label>
      Name:
      <input name="name">
    </label>
  </div>

  <div>
    <label>
      Organization:
      <input name="organization">
    </label>
  </div>

  <div>
    <label>
      Number:
      <input name="number">
    </label>
  </div>

  <div>
    <label>
      Email:
      <input name="email" type="email" required>
    </label>
  </div>

  <div>
    <label>
      Message:
      <textarea name="message"></textarea>
    </label>
  </div>

  <button type="submit">Submit</button>

</form>

</body>
</html>
