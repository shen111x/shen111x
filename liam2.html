<!doctype html>
<html>
<head>
<style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center; /* 垂直（主轴） */
      align-items: center;     /* 水平（交叉轴） */
    }

    *{ box-sizing: border-box; }

    .main{
      width: 400px;
      height:700px;
    }

    .FormMainBox {
      width: 100%;
      height:100%;
      padding:0px;
      margin:0px;
      background: #3f8df5;

      display: flex;
      flex-direction: column; /* 内容从上到下排列 */
      align-items: center;
      gap:24px;
    }

    .FormHeaderBox{
      width:100%;
      height:30%;
      padding:0px;
      margin:0px;

      background: #d9bb11;
    }

    .FormInputBox{
      width:100%;
      padding:0px;
      margin:0px;
      height:70%;

      display: flex;
      flex-direction: column; /* 内容从上到下排列 */
      align-items: center;
      gap:24px; /* <-- 补分号，不删注释 */
    }


    /* MVP floating label – minimal */

    /* 包裹 */
    .field{
      padding: 0px 16px 0px 16px;
      position: relative;
      width: 100%;
      height: 50px;
    }

    /* 输入框 */
    .field input{
      width:100%;
      height: 100%;
      padding: 12px 16px 0px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    /* 灰色 title */
    .field label{
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      color: #9a9a9a;
      font-size: 16px;
      pointer-events: none;
      transition: 0.2s ease;
    }

    /* 输入中 / 有值 → 左上角 */
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label{
      top: 11px;
      font-size: 10px;
    }
</style>
</head>

<body>
  <form class="main"
        action="https://script.google.com/macros/s/AKfycbwPEmGQkB601lUB4jiZwbT3i5r0JjgVQvw2BIf0BIWSIgncyQhQR8l_Xbqy_CMSdCLM/exec"
        method="POST">

    <div class="FormMainBox">
      <div class="FormHeaderBox"></div>

      <div class="FormInputBox">

        <div class="field">
          <input name="name" type="text" placeholder=" " />
          <label>Name</label>
        </div>

        <div class="field">
          <input name="organization" type="text" placeholder=" " />
          <label>Organization</label>
        </div>

        <div class="field">
          <input name="email" type="email" placeholder=" " required />
          <label>Email</label>
        </div>

        <div class="field">
          <input name="number" type="text" placeholder=" " />
          <label>Number</label>
        </div>

        <div class="field">
          <input name="message" type="text" placeholder=" " />
          <label>Message</label>
        </div>

        <button type="submit">Submit</button>

      </div>
    </div>
  </form>
</body>
</html>
