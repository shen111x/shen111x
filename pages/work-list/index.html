<body class="work-list-page">
  <iframe class="header-iframe" src="/components/header/index.html" title="Site header"></iframe>
  <!--
    Project 1 stays explicit with the full item structure so it is easy to find and edit.
    The work-list script loads the priority projects first, then scans the remaining numbered
    project-data folders through data-project-scan-max and inserts them automatically.
  -->
  <main class="work-list" aria-label="Work list" data-project-priority="1,simple-human,butter-cloth" data-project-scan-max="99">
    <div work-list-item-number="1">
      <article class="work-list-item">
        <a class="work-list-item__title-link" data-field="detail-link">
          <h2 class="work-list-item__title" data-field="title"></h2>
        </a>

        <div class="work-list-item__gallery" tabindex="0" aria-label="Project cover gallery">
          <div class="work-list-item__track" data-field="small-gallery"></div>
        </div>
      </article>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="/js/universal.js"></script>
  <script src="/pages/work-list/work-list-item/script.js"></script>
