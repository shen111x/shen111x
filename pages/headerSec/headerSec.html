<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0013ff" />
<title>空白网页</title>

<!-- CSS -->
<style>
body {
    font-family: Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    width:100%;
    height:30vw;
    overflow-y: hidden;
}

@media screen and (max-width: 600px) {
    .background { 
        background-color: #0013ff;
        height:100%;
        width:100%;
        display: flex;
        align-items: center;
        transition: height 0.3s ease;
    }
    .left { 
        height:100%;
        background-color: #0013ff;
        display: flex;
        align-items: center;
        transition: transform 0.3s ease; /* 添加过渡效果 */
    }
    .right { 
        width:23%;
        height:100%;
        background-color: #0013ff;
        display: inline;
    }
    .right-top {
        width:100%;
        height:50%;
    }
    .right-bottom {
        width:100%;
        height:49%;
    }
    h1 {
        font-size: 34vw;
        font-weight: 900;
        color:white;
        transition: transform 0.3s ease; /* 添加过渡效果 */
        transform: translateY(0%);
    }

    .h1small {
        transform: scale(0.26); /* 使用缩放来调整字体大小 */
    }

    .backgroundsmall {
        height:10vw;
    }

    .leftsmall {
        transform: translateX(-35.5%); /* 使用 translateX 调整位置 */
    }
}
</style>
</head>

<!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY -->
<body>
    <div class="background">
        <div class="left">
            <h1>Ess*</h1>
        </div>
        <div class="right">
            <div class="right-top"></div>
            <div class="right-bottom"></div>
        </div>
    </div>
</body>
<!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY --><!-- BODY -->

<!-- JavaScript -->
<script>
window.addEventListener('message', function(event) {
    var data = event.data;
    if (data.type === 'scroll') {
        var scrollDirection = data.scrollDirection;
        var background = document.querySelector('.background');
        var h1Element = document.querySelector('h1');
        var leftElement = document.querySelector('.left');

        if (scrollDirection === 'down') {
            // 回上面
            background.classList.remove("backgroundsmall");
            h1Element.classList.remove("h1small");
            leftElement.classList.remove("leftsmall");
        } else {
            // 去下面
            background.classList.add("backgroundsmall");
            h1Element.classList.add("h1small");
            leftElement.classList.add("leftsmall");
        }
    }
});
</script>
<!-- JavaScript -->

</html>
