<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Screen Saver Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 禁止滚动条 */
        }

        #dvd {
            position: absolute;
            width: 100px;
            height: 50px;
            background-color: #ff0000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="dvd">DVD</div>

<script>
    const dvdLogo = document.getElementById("dvd");
    let posX = 0;
    let posY = 0;
    let velX = 5; // 水平方向速度
    let velY = 5; // 垂直方向速度

    // 更新DVD位置的函数
    function moveDVD() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const dvdWidth = dvdLogo.offsetWidth;
        const dvdHeight = dvdLogo.offsetHeight;

        // 更新位置
        posX += velX;
        posY += velY;

        // 碰撞检测：左右碰壁
        if (posX + dvdWidth >= width || posX <= 0) {
            velX = -velX; // 反转水平速度
        }

        // 碰撞检测：上下碰壁
        if (posY + dvdHeight >= height || posY <= 0) {
            velY = -velY; // 反转垂直速度
        }

        // 设置新位置
        dvdLogo.style.left = posX + "px";
        dvdLogo.style.top = posY + "px";

        // 使用requestAnimationFrame实现平滑动画
        requestAnimationFrame(moveDVD);
    }

    // 开始动画
    moveDVD();
</script>

</body>
</html>
