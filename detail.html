<body>

    <iframe src="headerSec.html" class="header"></iframe>

    <iframe id="caseStudyIframe" src="" style="margin-top: 35vh;"></iframe>


   







    <script>

        // 获取scroll信息判断往上还是往下发送信息去iframe /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
        var prevScrollPos = window.pageYOffset;
        var scrollDirection;
        window.onscroll = function() {
            var currentScrollPos = window.pageYOffset;
            var pageScrollX = window.pageXOffset;
            var maxScrollPos = Math.max(window.scrollMaxY || 0, document.body.scrollHeight - window.innerHeight);
        
            if ((currentScrollPos > 0 && currentScrollPos < maxScrollPos) && currentScrollPos !== pageScrollX) {
                if (currentScrollPos === 0 || currentScrollPos === maxScrollPos) {
                    scrollDirection = 'down'; // 当滚动到顶部或底部时，默认显示
                } else if (prevScrollPos > currentScrollPos) {
                    scrollDirection = 'down'; // 向上滚动，显示 div
                } else {
                    scrollDirection = 'up'; // 向下滚动，隐藏 div
                }
            }
        
            prevScrollPos = currentScrollPos;
        
            var message = {
                type: 'scroll',
                scrollDirection: scrollDirection,
            };
            var iframeWindow = document.querySelector('.header').contentWindow;
            iframeWindow.postMessage(message, '*');
        };
        
        // 获取URL中的查询参数 （动态更新casestudy iframe的src ）///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 从referrer中提取文件夹路径
        function extractFolderFromReferrer(referrer) {
    const referrerUrl = new URL(referrer);
    const pathParts = referrerUrl.pathname.split('/');
    if (pathParts.length >= 2) {
        // 检查并返回文件夹路径
        return pathParts.slice(-2, -1)[0];
    }
    return '';
}

document.addEventListener("DOMContentLoaded", function() {
    const caseStudyFile = getQueryParameter('path');
    if (!caseStudyFile) {
        console.error("No path provided.");
        return;
    }

    const referrer = document.referrer;
    let folder = '';

    if (referrer) {
        folder = extractFolderFromReferrer(referrer);
    }

    console.log("Referrer:", referrer);
    console.log("Extracted Folder:", folder);
    console.log("Case Study File:", caseStudyFile);

    let iframeSrc = '';
    if (folder) {
        iframeSrc = `${folder}/${caseStudyFile}`;
    } else {
        iframeSrc = caseStudyFile;
    }

    console.log("Final Iframe Source:", iframeSrc);

    const iframe = document.getElementById('caseStudyIframe');
    iframe.src = iframeSrc;

    iframe.onload = function() {
        setTimeout(function() {
            resizeIframe(iframe);
        }, 100);
    };
});
//动态更新iframe的高度///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
function resizeIframe(iframe) {
    try {
        if (iframe.contentDocument) {
            var iframeDocument = iframe.contentDocument || iframe.contentWindow.document;
            iframe.style.height = iframeDocument.body.scrollHeight + 'px';
            console.log("Resized iframe to height: " + iframe.style.height);
        } else {
            console.error("Iframe contentDocument is null. Cannot resize iframe.");
        }
    } catch (error) {
        console.error("Error resizing iframe:", error); 
    } 
}
        </script>
