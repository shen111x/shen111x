<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" />
    <title>Ess*</title>

    <!-- CSS  -->
    <style>
        body {
            font-family: Helvetica, Helvetica, sans-serif;
            margin: 0px;
            padding: 0px;
            height: auto;
        }

        h2 {
            font-size: 8vw;
            font-weight: 900;
        }

        H3 {
            margin-left: 13px;
        } 

        p {
            margin-left: 13px;
        }

        iframe {
            border: 0px;
        }

        .header { 
            background-color: none;
            height: 30vw;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .main {
            width: 88%;
        }

        .side {
            width: 12%;
        }

        [id^="projectTitle"] {
            position: sticky;
            top: 30vw;
        }

        .info {
            width: 86.12px;
            height: 50px;
            object-fit: contain;
        }

        .infoBack {
            width: 90vw;
            display: flex;
            flex-wrap: nowrap;
            justify-content: start;
            align-items: center;
            margin-left: 13px;
            height: 60px;
        }

        h4 {
            padding: 0;
            margin: 0;
            font-size: 1em;
            margin-right: 20px;
            cursor: pointer;
        }
    </style>
    <!-- CSS END -->

</head>
<body>
    <iframe src="headerSec.html" class="header" alt="This Is Header !!!!"></iframe>
   
    <div style="height: 60vw;"></div>

    <!-- The script will dynamically add content here -->

    <!-- EXAMPLE

    
    <div class="infoBack">
        <div style="width:65%">
           <h4 id="tittleText1"></h4>
       </div>
     
       <iframe class="info" src="1/gallerySmall.html"></iframe>
   </div>


   -->
    

   <script>

    // 动态添加block 并且给其加入clickble的功能跳转到detail.html 并且动态更新detail.html中引用的iframe的src///////////////////////////////////////////////////////////////////////////////////
    
    document.addEventListener("DOMContentLoaded", function() {
        function loadTextContent(folderIndex) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', folderIndex + '/text/tittleText.txt', true);  // 动态生成路径
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var content = xhr.responseText;
                    document.getElementById('tittleText' + folderIndex).innerHTML = content.replace(/\n/g, "<br>");
                }
            };
            xhr.send();
        }

        function createInfoBack(folderIndex) {
            var container = document.createElement('div');
            container.className = 'infoBack';

            var textContainer = document.createElement('div');
            textContainer.style.width = '65%';

            var title = document.createElement('h4');
            title.id = 'tittleText' + folderIndex;
            title.className = 'clickable'; // 添加 clickable 类
            title.setAttribute('data-path', folderIndex + '/caseStudy.html'); // 设置 data-path 属性

            var iframe = document.createElement('iframe');
            iframe.className = 'info clickable'; // 添加 clickable 类
            iframe.src = folderIndex + '/gallerySmall.html';
            iframe.setAttribute('data-path', folderIndex + '/caseStudy.html'); // 设置 data-path 属性

            textContainer.appendChild(title);
            container.appendChild(textContainer);
            container.appendChild(iframe);

            document.body.appendChild(container);
            document.body.appendChild(document.createElement('br')); // 添加换行符以创建间距

            // 监听iframe加载完成事件并绑定点击事件
            iframe.onload = function() {
                iframe.contentWindow.addEventListener('click', function() {
                    const path = iframe.getAttribute('data-path');
                    if (path) {
                        window.top.location.href = `detail.html?path=${encodeURIComponent(path)}`;
                    }
                });
            };
        }

        // 获取文件夹数量，假设文件夹名称是连续数字 ！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！
        var folderCount = 13; // 假设最大文件夹数为12
         // 获取文件夹数量，假设文件夹名称是连续数字 ！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！
        

        for (var i = 1; i <= folderCount; i++) {
            createInfoBack(i);
            loadTextContent(i);
        }

        // 为动态生成的 clickables 添加点击事件监听器
        document.body.addEventListener('click', function(event) {
            if (event.target.classList.contains('clickable')) {
                event.preventDefault();  // 阻止默认行为
                event.stopPropagation(); // 阻止事件冒泡

                const path = event.target.getAttribute('data-path');
                console.log("Element clicked:", event.target);
                console.log("Path:", path);

                if (path) {
                    window.top.location.href = `detail.html?path=${encodeURIComponent(path)}`;
                }
            }
        });
    });

    // 获取scroll信息判断往上还是往下发送信息去iframe////////////////////////////////////////////////////////////////////////////////////////////////////
    window.onscroll = function() {
        var prevScrollPos = window.pageYOffset;
        var scrollDirection;
        window.onscroll = function() {
            var currentScrollPos = window.pageYOffset;
            var pageScrollX = window.pageXOffset;
            var maxScrollPos = Math.max(window.scrollMaxY || 0, document.body.scrollHeight - window.innerHeight);

            // 添加限制条件
            if ((currentScrollPos > 0 && currentScrollPos < maxScrollPos) && currentScrollPos !== pageScrollX) {
                if (currentScrollPos === 0 || currentScrollPos === maxScrollPos) {
                    scrollDirection = 'down'; // 当滚动到顶部或底部时，默认显示
                } else if (prevScrollPos > currentScrollPos) {
                    scrollDirection = 'down'; // 向上滚动，显示 div
                } else {
                    scrollDirection = 'up'; // 向下滚动，隐藏 div
                }
            }

            prevScrollPos = currentScrollPos;

            var message = {
                type: 'scroll',
                scrollDirection: scrollDirection,
            };
            var iframeWindow = document.querySelector('.header').contentWindow;
            iframeWindow.postMessage(message, '*');

            var projectTitles = document.querySelectorAll('[id^="projectTitle"]');
            projectTitles.forEach(function(title) {
                if (scrollDirection === 'up') {
                    title.style.top = '10vw';
                    title.style.transform = 'none'; 
                    title.style.transition = 'top 0.5s, transform 0.5s';
                } else {
                    title.style.top = ''; 
                    title.style.transition = 'top 0.5s, transform 0.5s';
                }
            });
        };
    }
</script>
</body>
</html>
