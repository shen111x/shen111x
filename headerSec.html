body {

                                                   @media screen and (max-width: 600px) {
    .background { 
        background-color: rgb(255, 255, 255);
        height:100%;
        width:100%;
        display: flex;
        align-items: center;
        transition: height 0.3s ease;
    }
    .left { 
        height:100%;
        background-color: transparent;
        display: flex;
        align-items: center;
        transition: transform 0.3s ease; /* 添加过渡效果 */
        transform: translateX(-0.5%);
    }
    .right { 
        width:23%;
        background-color: transparent;
        display:none;
        transition: transform 0.3s ease; /* 添加过渡效果 */
        transform: translateX(0%);

    }

    .rightsmall{
        
        display: flex;
        align-items: center;
        transform: translateX(-185%);
        
    }

    .nav{ 
        position: fixed; /* 将.nav元素固定在页面上 */
        top: 0; /* 距离顶部的距离为0 */
        width: 100vw; /* 宽度占满整个页面 */
        height: 10vw; /* 高度为10vw */
        z-index: 9999; /* 设置z-index以确保.nav在其他内容之上 */
        opacity: 0; /* 初始时透明 */
        transition: opacity 0.3s ease; /* 添加过渡效果 */
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        
    }
    .navsmall{ 
        opacity: 100;
    }
    .navsub{
        width:19vw;
        height:10vw;
        display:flex;
        justify-content: flex-end;
        margin-right: 10px;
       
    }

    .navblank{
        width:38vw;

    }

    .right-top {
        width:100%;
        height:50%;
    }
    .right-bottom {
        width:100%;
        height:49%;
    }
    h1 {
        font-size: 34vw;
        font-weight: 900;
        color:black;
        transition: transform 0.3s ease; /* 添加过渡效果 */
        transform: translateY(0%);
    }

    h2 {
        font-size: 8.5vw;
        font-weight: 900;
        color:black;
        transition: transform 0.3s ease; /* 添加过渡效果 */
        transform: translateY(0%);
    }

    .h1small {
        transform: scale(0.26); /* 使用缩放来调整字体大小 */
    }

    .backgroundsmall {
        height:10vw;
    }

    .leftsmall {
        transform: translateX(-35%); /* 使用 translateX 调整位置 */
    }
}

<!-- JavaScript -->
<script>
window.addEventListener('message', function(event) {
    var data = event.data;
    if (data.type === 'scroll') {
        var scrollDirection = data.scrollDirection;
        var background = document.querySelector('.background');
        var h1Element = document.querySelector('h1');
        var leftElement = document.querySelector('.left');
        var nav = document.querySelector('.nav');
        var rightElement = document.querySelector('.right');

        if (scrollDirection === 'down') {// 回上面
            background.classList.remove("backgroundsmall");
            h1Element.classList.remove("h1small");
            leftElement.classList.remove("leftsmall");
            rightElement.classList.remove("rightsmall");
            nav.classList.remove("navsmall");

        } else {// 去下面
            background.classList.add("backgroundsmall");
            h1Element.classList.add("h1small");
            leftElement.classList.add("leftsmall");
            nav.classList.add("navsmall");
            rightElement.classList.add("rightsmall");
            
            }}});
</script>
