<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EE%3C/text%3E%3C/svg%3E">
  <title>Ean's Portfolio</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6PY3JWY980"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6PY3JWY980');
  </script>
  <link rel="stylesheet" href="/css/universal.css?v=20260806">
  <link rel="stylesheet" href="/components/project-card/style.css">
  <link rel="stylesheet" href="/components/footer/style.css?v=20260806">
  <style>
    .home-hero {
      padding: calc(var(--header-expanded-height) + (10 * var(--page-gutter))) var(--page-gutter) 0;
    }

    .home-hero__graphic {
      display: block;
      width: min(48vw, 400px);
      height: auto;
    }

    .home-hero__details,
    .home-hero__cta {
      margin: calc(4 * var(--page-gutter)) 0 0;
      line-height: 1.2;
    }

    .home-hero__details-muted {
      color: rgb(0 0 0 / var(--category-opacity));
    }

    .home-hero__cta a {
      text-underline-offset: 3px;
    }

    .home-projects-divider {
      margin: calc(8 * var(--page-gutter)) var(--page-gutter);
      line-height: 1;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 100px;
      padding: 0 var(--page-gutter);
      padding-bottom: 100px;
    }

    @media (max-width: 600px) {
      .home-hero__graphic { width: 82vw; }
    }
  </style>
</head>
<body class="home-page">
  <iframe class="header-iframe" src="/components/header/index.html" title="Site header"></iframe>

  <main>
    <section class="home-hero" aria-label="Introduction">
      <img
        class="home-hero__graphic"
        src="/images/hero.svg"
        alt="Branding, Visual Identity, Typography, Cross-Channel Campaign, User Experience and UI, Motion Graphics, Design System, Blender 3D, Print Production, Front-End"
      >

      <p class="home-hero__details">
        For Consumer &amp; B2B Brands<br>
        Across: CPG, SaaS, E-commerce<br>
        All stages: 0-1, Rebrand &amp; Systemization<br>
        <span class="home-hero__details-muted">C2C contracts ONLY</span>
      </p>

      <p class="home-hero__cta">
        <a href="#project-1">See Projects</a>
      </p>
    </section>

    <div class="home-projects-divider" aria-hidden="true">+</div>

    <section class="project-list" aria-label="Featured projects">
      <div project-number="1"></div>
      <div project-number="simple-human"></div>
      <div project-number="butter-cloth"></div>
      <div project-number="2"></div>
      <div project-number="3"></div>
      <div project-number="4"></div>
      <div project-number="5"></div>
      <div project-number="6"></div>
      <div project-number="7"></div>
      <div project-number="8"></div>
      <div project-number="9"></div>
      <div project-number="10"></div>
      <div project-number="11"></div>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="/js/universal.js"></script>
  <script src="/components/project-card/script.js"></script>
  <script src="/components/footer/script.js?v=20260806"></script>
</body>
</html>
